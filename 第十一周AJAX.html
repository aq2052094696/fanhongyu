<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON-Server + AJAX 数据渲染</title>
    <style>
        :root {
            --pink: #ff4fa3;
            --purple: #8a2be2;
            --bg-card: rgba(255, 255, 255, 0.08);
            --border-glass: rgba(255, 255, 255, 0.18);
            --text: #fff;
            --text-dim: #d8c8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--text);
            background:
                radial-gradient(ellipse at 20% 10%, rgba(255,79,163,0.35) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 90%, rgba(138,43,226,0.4) 0%, transparent 50%),
                linear-gradient(135deg, #0f0420 0%, #1a0a2e 50%, #2a0f3d 100%);
            background-attachment: fixed;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        /* 标题 */
        .header { text-align: center; margin-bottom: 36px; }
        .header h1 {
            font-size: 42px; font-weight: 800;
            background: linear-gradient(90deg, #ff4fa3, #c77dff, #ff4fa3);
            background-size: 200% 100%;
            -webkit-background-clip: text; background-clip: text;
            color: transparent;
            animation: shine 4s linear infinite;
            letter-spacing: 4px;
        }
        .header p { margin-top: 10px; color: var(--text-dim); font-size: 14px; letter-spacing: 2px; }
        .api-info {
            display: inline-block;
            margin-top: 14px;
            padding: 6px 18px;
            background: rgba(0,200,100,0.2);
            border: 1px solid rgba(0,255,150,0.4);
            border-radius: 20px;
            font-size: 13px;
            color: #7fffc0;
            font-family: Consolas, monospace;
        }
        .api-info.error { background: rgba(255,60,60,0.2); border-color: rgba(255,100,100,0.5); color: #ff8080; }
        .api-info.loading { background: rgba(255,200,50,0.15); border-color: rgba(255,200,50,0.4); color: #ffcc66; }

        @keyframes shine {
            0%   { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 统计 */
        .stats {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-bottom: 28px;
        }
        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px; padding: 22px 14px; text-align: center;
            transition: all 0.4s;
        }
        .stat-card:hover { transform: translateY(-6px); box-shadow: 0 12px 40px rgba(255,79,163,0.35); }
        .stat-card .num {
            font-size: 34px; font-weight: 800;
            background: linear-gradient(135deg, #ff4fa3, #c77dff);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .stat-card .label { font-size: 13px; color: var(--text-dim); margin-top: 6px; }

        /* 工具栏 */
        .toolbar {
            display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
        }
        .toolbar button {
            padding: 10px 24px; border-radius: 24px; border: 1px solid var(--border-glass);
            background: var(--bg-card); backdrop-filter: blur(10px); color: var(--text-dim);
            cursor: pointer; font-size: 14px; letter-spacing: 1px; transition: all 0.3s;
        }
        .toolbar button:hover { color: #fff; border-color: var(--pink); }
        .toolbar button.active {
            background: linear-gradient(135deg, #ff4fa3, #8a2be2);
            color: #fff; border-color: transparent;
            box-shadow: 0 4px 20px rgba(255,79,163,0.5); font-weight: bold;
        }
        .toolbar button.loading-state { opacity: 0.6; pointer-events: none; }

        /* 表格 */
        .table-wrap {
            background: var(--bg-card); backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass); border-radius: 20px;
            padding: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        thead th {
            padding: 14px; text-align: left;
            background: linear-gradient(135deg, rgba(255,79,163,0.5), rgba(138,43,226,0.5));
            color: #fff; font-weight: 600; font-size: 13px; letter-spacing: 1px;
        }
        thead th:first-child { border-radius: 14px 0 0 0; }
        thead th:last-child  { border-radius: 0 14px 0 0; }
        tbody td { padding: 13px; border-bottom: 1px solid rgba(255,255,255,0.08); color: #eee; font-size: 14px; }
        tbody tr:hover td { background: rgba(255,79,163,0.1); }

        .score-bar {
            display: inline-block; width: 70px; height: 8px;
            background: rgba(255,255,255,0.15); border-radius: 4px;
            overflow: hidden; vertical-align: middle; margin-right: 8px;
        }
        .score-bar i {
            display: block; height: 100%;
            background: linear-gradient(90deg, #ff4fa3, #c77dff); border-radius: 4px;
        }

        /* 卡片 */
        .card-view {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px;
        }
        .card {
            background: var(--bg-card); backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass); border-radius: 20px;
            padding: 26px 22px; position: relative; overflow: hidden;
            transition: all 0.45s cubic-bezier(.2,.9,.3,1.3);
        }
        .card::before {
            content: ""; position: absolute; top: -60px; right: -60px;
            width: 160px; height: 160px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,79,163,0.4), transparent 70%);
        }
        .card:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 20px 50px rgba(255,79,163,0.4); border-color: var(--pink); }
        .card .avatar {
            width: 68px; height: 68px; border-radius: 50%;
            background: linear-gradient(135deg, #ff4fa3, #8a2be2);
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 14px;
            box-shadow: 0 4px 20px rgba(255,79,163,0.5);
        }
        .card h3 { font-size: 22px; font-weight: 800; color: #fff; }
        .card .en-name { font-size: 13px; color: var(--text-dim); font-style: italic; margin-top: 2px; }
        .card .team-badge {
            display: inline-block; margin-top: 12px; padding: 4px 14px;
            border-radius: 20px; font-size: 12px; font-weight: bold;
        }
        .badge-ive   { background: linear-gradient(135deg, #d8b4fe, #a855f7); color: #fff; }
        .badge-black { background: linear-gradient(135deg, #ff4fa3, #c2185b); color: #fff; }
        .card-info { margin-top: 14px; }
        .card-info p { font-size: 13px; color: #d8c8f0; line-height: 2; }
        .card-info p span { color: #fff; font-weight: bold; }

        .popularity { margin-top: 12px; }
        .popularity .label {
            font-size: 12px; color: var(--text-dim);
            display: flex; justify-content: space-between; margin-bottom: 4px;
        }
        .popularity .bar {
            height: 8px; background: rgba(255,255,255,0.15);
            border-radius: 4px; overflow: hidden;
        }
        .popularity .bar i {
            display: block; height: 100%;
            background: linear-gradient(90deg, #ff4fa3, #c77dff); border-radius: 4px;
            box-shadow: 0 0 10px rgba(255,79,163,0.8);
        }

        /* 加载状态 */
        .loader {
            text-align: center; padding: 60px; color: var(--text-dim); font-size: 15px;
        }
        .loader .spin-box {
            width: 40px; height: 40px; margin: 0 auto 16px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: var(--pink); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .error-box {
            text-align: center; padding: 40px; color: #ff8080;
            background: rgba(255,60,60,0.1); border-radius: 16px;
            border: 1px solid rgba(255,100,100,0.3);
        }

        /* 原始JSON */
        .raw-json {
            background: rgba(0,0,0,0.5); border: 1px solid var(--border-glass);
            border-radius: 20px; padding: 28px;
            font-family: "Fira Code", Consolas, monospace; font-size: 13px;
            line-height: 1.7; color: #f8f8f2; overflow-x: auto; white-space: pre;
            box-shadow: inset 0 0 40px rgba(255,79,163,0.15);
        }

        .hidden { display: none !important; }

        /* 响应式 */
        @media (max-width: 768px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .header h1 { font-size: 26px; letter-spacing: 2px; }
            .card-view { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ AJAX 实时加载 ✨</h1>
            <p>数据来源：JSON-Server · http://localhost:3000/members</p>
            <div class="api-info loading" id="apiStatus">⏳ 正在连接服务器...</div>
        </div>

        <div class="stats" id="stats"></div>

        <div class="toolbar">
            <button class="active" data-view="table">📋 表格视图</button>
            <button data-view="card">💎 卡片视图</button>
            <button data-view="raw">⚙️ 原始JSON</button>
            <button id="reloadBtn">🔄 重新加载</button>
        </div>

        <div id="view-table" class="table-wrap"><div class="loader"><div class="spin-box"></div>加载中...</div></div>
        <div id="view-card" class="hidden card-view"></div>
        <div id="view-raw" class="hidden raw-json"></div>
    </div>

    <script>
        // ============ 配置 ============
        const API_URL = 'http://localhost:3000/members';
        let members = [];

        // ============ 状态提示 ============
        function setApiStatus(type, msg) {
            const el = document.getElementById('apiStatus');
            el.className = 'api-info ' + type;
            el.textContent = msg;
        }

        // ============ AJAX：XMLHttpRequest ============
        function fetchWithXHR(url) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.setRequestHeader('Accept', 'application/json');
                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        resolve(JSON.parse(xhr.responseText));
                    } else {
                        reject(new Error('HTTP ' + xhr.status));
                    }
                };
                xhr.onerror = () => reject(new Error('网络错误'));
                xhr.send();
            });
        }

        // ============ AJAX：fetch API ============
        async function fetchWithFetch(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        }

        // ============ 加载数据 ============
        async function loadData() {
            setApiStatus('loading', '⏳ 正在从 ' + API_URL + ' 获取数据...');
            document.getElementById('view-table').innerHTML = '<div class="loader"><div class="spin-box"></div>加载中...</div>';

            try {
                // 方式一：XMLHttpRequest（AJAX 经典写法）
                // members = await fetchWithXHR(API_URL);

                // 方式二：fetch API（现代写法，推荐）
                members = await fetchWithFetch(API_URL);

                setApiStatus('', '✅ 连接成功 · 共 ' + members.length + ' 条数据');
                renderAll();
            } catch (err) {
                console.error(err);
                setApiStatus('error', '❌ 连接失败：' + err.message);
                document.getElementById('view-table').innerHTML = `
                    <div class="error-box">
                        <h3 style="margin-bottom:10px;">⚠️ 无法连接到 JSON-Server</h3>
                        <p>请在 terminal 中运行：</p>
                        <code style="display:block;margin:12px auto;padding:10px 16px;background:rgba(0,0,0,0.4);border-radius:8px;width:fit-content;">
cd database && npx json-server fanhongyu.json --port 3000
                        </code>
                        <p style="margin-top:12px;font-size:13px;">错误信息：${err.message}</p>
                    </div>
                `;
            }
        }

        // ============ 渲染 ============
        function renderStats(data) {
            if (!data.length) return;
            const ive   = data.filter(m => m.team === 'IVE').length;
            const black = data.filter(m => m.team === 'BLACKPINK').length;
            const avg   = (data.reduce((s, m) => s + m.score, 0) / data.length).toFixed(1);
            const top   = [...data].sort((a, b) => b.score - a.score)[0];

            document.getElementById('stats').innerHTML = `
                <div class="stat-card"><div class="num">${data.length}</div><div class="label">总成员</div></div>
                <div class="stat-card"><div class="num">${ive}</div><div class="label">IVE 成员</div></div>
                <div class="stat-card"><div class="num">${black}</div><div class="label">BLACKPINK</div></div>
                <div class="stat-card"><div class="num">${avg}</div><div class="label">平均人气</div></div>
                <div class="stat-card"><div class="num">${top.name}</div><div class="label">人气第一 · ${top.score}分</div></div>
            `;
        }

        function renderTable(data) {
            document.getElementById('view-table').innerHTML = `
                <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th><th>姓名</th><th>英文名</th><th>团体</th>
                            <th>职位</th><th>年龄</th><th>人气</th><th>代表作品</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.map(m => `
                            <tr>
                                <td>#${m.id}</td>
                                <td><strong>${m.name}</strong></td>
                                <td style="color:#d8c8f0;font-style:italic;">${m.enName}</td>
                                <td style="color:${m.team==='IVE'?'#c77dff':'#ff4fa3'};font-weight:bold;">${m.team}</td>
                                <td>${m.position}</td>
                                <td>${m.age}岁</td>
                                <td><span class="score-bar"><i style="width:${m.score}%"></i></span>${m.score}</td>
                                <td style="color:#d8c8f0;">${m.hit}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                </div>
            `;
        }

        function renderCards(data) {
            document.getElementById('view-card').innerHTML = data.map(m => `
                <div class="card">
                    <div class="avatar">${m.name[0]}</div>
                    <h3>${m.name}</h3>
                    <div class="en-name">${m.enName}</div>
                    <span class="team-badge ${m.team === 'IVE' ? 'badge-ive' : 'badge-black'}">${m.team}</span>
                    <div class="card-info">
                        <p><span>🎤 职位：</span>${m.position}</p>
                        <p><span>🎂 年龄：</span>${m.age}岁</p>
                        <p><span>📅 出道：</span>${m.debut}</p>
                        <p><span>💖 爱好：</span>${m.hobby.join(' / ')}</p>
                    </div>
                    <div class="popularity">
                        <div class="label"><span>🔥 人气指数</span><span>${m.score}</span></div>
                        <div class="bar"><i style="width:${m.score}%"></i></div>
                    </div>
                </div>
            `).join('');
        }

        function renderRaw(data) {
            document.getElementById('view-raw').textContent = JSON.stringify(data, null, 4);
        }

        function renderAll() {
            renderStats(members);
            renderTable(members);
            renderCards(members);
            renderRaw(members);
        }

        // ============ 视图切换 ============
        function switchView(view) {
            document.querySelectorAll('.toolbar button[data-view]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === view);
            });
            ['table', 'card', 'raw'].forEach(v => {
                document.getElementById('view-' + v).classList.toggle('hidden', v !== view);
            });
        }

        document.querySelectorAll('.toolbar button[data-view]').forEach(btn => {
            btn.addEventListener('click', () => switchView(btn.dataset.view));
        });
        document.getElementById('reloadBtn').addEventListener('click', loadData);

        // ============ 启动 ============
        loadData();
    </script>
</body>
</html>
