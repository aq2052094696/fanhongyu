<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026-10-19 樊宏宇 JavaScript</title>
</head>
<body>
    <script>
        // 变量的定义和赋值
        var name = "樊宏宇";
        console.log("姓名：" + name); // 输出: 樊宏宇到控制台
        document.write("<h1>JavaScript基础</h1>"); // 输出: JavaScript基础
        document.write("Hello World!" + "<br>"); // 输出: Hello World!姓名：樊宏宇
        document.write("姓名：" + name + "<br>"); // 换行
        alert("欢迎来到JavaScript的世界!"); // 弹出提示框
        var res = confirm("你喜欢学习JavaScript吗?"); // 弹出确认框
        if (res) {
            document.write("你选择了喜欢学习JavaScript" + "<br>");
            console.log("用户选择的是确认值：" + res); // 输出到控制台
        } else {
            document.write("你选择了不喜欢学习JavaScript" + "<br>");
            console.log("用户选择的是取消值：" + res); // 输出到控制台
        }
    </script>
</body>
</html>
