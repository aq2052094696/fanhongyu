<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>樊宏宇 媒体查询</title>
    <style>
        div,h2{
            margin:0;
            padding:0;
        }
        body,html,#box{
            height:100%;
        }
        #box{
            background-color: aqua;
            color: #f0f0f0;
            font-size: 100px;
            text-align: center;
        }
        html{
            font-size: 5.6vw;
        }
        #box>h2{
            font-size: 1.5rem;
            line-height: height 3rem;
            text-shadow: .5rem .5rem 1rem#fff;
            padding: .5rem .6rem;
        }
        @media screen and (max-width:2000px){
            #box{
                background-color: #f4f4;
            }
            #box>h2{
                color:#0cc;
            }
        }
        @media screen and (max-width:768px){
            #box{
                background-color: #00c;
            }
        }
    </style>
</head>
<body>
    <div id="box">
        <h2>樊宏宇 媒体查询</h2> 

    </div>
</body>
</html>
