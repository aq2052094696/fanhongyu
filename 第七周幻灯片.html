<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>第七周幻灯片</title>
    <style>
        .slide {
            width: 600px;
            height: 350px;
            overflow: hidden;
            border: 2px solid red;
            margin: 30px auto;
        }
        .slide ul {
            width: 500%;
            display: flex;
            list-style: none;
            padding: 0;
            margin: 0;
            /* 总时长10秒，无限循环，linear */
            animation: chenyy 10s infinite linear;
        }
        .slide li {
            width: 100%;
        }
        .slide img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            display: block;
        }

        /* 课堂这种分段停留关键帧 */
        @keyframes chenyy {
            10% {
                margin-left: 0;
            }
            20% {
                margin-left: -100%;
            }
            30% {
                margin-left: -100%;
            }
            40% {
                margin-left: -200%;
            }
            50% {
                margin-left: -200%;
            }
            60% {
                margin-left: -300%;
            }
            70% {
                margin-left: -300%;
            }
            80% {
                margin-left: -400%;
            }
            90% {
                margin-left: -400%;
            }
            100% {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="slide">
        <ul>
            <li><img src="img/1.jpg" alt="图1"></li>
            <li><img src="img/2.jpg" alt="图2"></li>
            <li><img src="img/3.jpg" alt="图3"></li>
            <li><img src="img/4.jpg" alt="图4"></li>
            <li><img src="img/5.jpg" alt="图5"></li>
        </ul>
    </div>
</body>
</html>
