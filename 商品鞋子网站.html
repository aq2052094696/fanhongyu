<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>樊宏宇 CSS布局</title>
    <link rel="stylesheet" href="./css/thirdone.css">
</head>
<body>
    <div id="header">
        <div id="logo">
            Logo
        </div>
        <div id="login">登录</div>
    </div>
    <div id="main">
        <div id="nav">导航栏</div>
        <div id="conent">
            <div class="container">
                <h2>精选商品卡片</h2>
                <div id="card-wrap" class="card-wrap">
                    <!-- 鞋子商品卡片 -->
                    <div class="card">
                        <div class="card-img">
                            <img src="./img1/shoe.jpg" alt="运动鞋">
                        </div>
                        <h3 class="card-title">透气休闲运动鞋</h3>
                        <p class="card-desc">轻便百搭运动跑鞋</p>
                        <div class="price">¥899.00</div>
                    </div>
                </div>
            </div>
        </div>
        <div id="aside">
            <h3>商品分类</h3>
            <ul>
                <li>运动鞋</li>
                <li>休闲鞋</li>
                <li>篮球鞋</li>
                <li>跑步鞋</li>
            </ul>
        </div>
        <div id="ad">广告区域</div>
    </div>
</body>
</html>
