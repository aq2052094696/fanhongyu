<!DOCTYPE html>
<!-- 姓名：樊宏宇 | 学号：24001010618 | 时间：2026-11-19 | 大模型：Tencent Hunyuan Hy -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fanhy · 图文列表</title>
<link rel="stylesheet" href="css/Fanhy_theme.css">
<style>
  .Fanhy_gallery-grid {
    columns: 3;
    column-gap: 20px;
    margin-top: 26px;
    padding-bottom: 20px;
  }
  .Fanhy_gallery-item {
    break-inside: avoid;
    margin-bottom: 20px;
    overflow: hidden;
    padding: 0;
    transition: transform .4s cubic-bezier(.2,.7,.3,1), box-shadow .4s, border-color .4s;
  }
  .Fanhy_gallery-item:hover {
    transform: translateY(-8px) rotate(-.4deg);
    border-color: rgba(247,212,136,.5);
    box-shadow: 0 28px 55px rgba(0,0,0,.55), 0 0 34px rgba(247,212,136,.14);
  }
  .Fanhy_gallery-pic { position: relative; overflow: hidden; }
  .Fanhy_gallery-pic img {
    width: 100%; height: auto; display: block;
    transition: transform .6s ease;
  }
  .Fanhy_gallery-item:hover .Fanhy_gallery-pic img { transform: scale(1.06); }
  .Fanhy_gallery-tag {
    position: absolute; left: 12px; top: 12px;
    padding: 4px 11px; border-radius: 999px;
    font-size: 11.5px; font-weight: 700; color: #fff;
    background: rgba(10,15,40,.6); border: 1px solid rgba(255,255,255,.22);
    backdrop-filter: blur(8px);
  }
  .Fanhy_gallery-info { padding: 18px 20px 20px; }
  .Fanhy_gallery-info h3 { margin: 0 0 8px; font-size: 17px; font-weight: 800; }
  .Fanhy_gallery-info p { margin: 0 0 14px; font-size: 13px; color: var(--Fanhy-ink-soft); line-height: 1.7; }
  .Fanhy_gallery-foot {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 12px; color: var(--Fanhy-muted);
    border-top: 1px solid var(--Fanhy-glass-line); padding-top: 12px;
  }
  .Fanhy_likes { color: var(--Fanhy-pink); font-weight: 700; }
  .Fanhy_count-pill {
    padding: 6px 14px; border-radius: 999px; font-size: 13px;
    background: rgba(247,212,136,.14); color: var(--Fanhy-gold); font-weight: 700;
  }
  .Fanhy_raw {
    margin-top: 30px; max-height: 260px; overflow: auto; padding: 18px;
    font-family: Consolas, monospace; font-size: 12px; line-height: 1.7;
    color: var(--Fanhy-ink-soft); white-space: pre-wrap; word-break: break-all;
  }
  .Fanhy_loading { padding: 60px 0; text-align: center; color: var(--Fanhy-muted); font-size: 15px; column-span: all; }
  @media (max-width: 900px) { .Fanhy_gallery-grid { columns: 2; } }
  @media (max-width: 600px) { .Fanhy_gallery-grid { columns: 1; } }
</style>
</head>
<body class="Fanhy-body">

<div class="Fanhy-fluid" aria-hidden="true">
  <div class="Fanhy-blob Fanhy-blob-a"></div>
  <div class="Fanhy-blob Fanhy-blob-b"></div>
  <div class="Fanhy-blob Fanhy-blob-c"></div>
</div>
<canvas id="Fanhy_particleCanvas" class="Fanhy_particles" aria-hidden="true"></canvas>

<div class="Fanhy_wrap">
  <header class="Fanhy_topbar">
    <div class="Fanhy_topbar-brand">
      <span class="Fanhy_logo-dot"></span>
      <a href="index.html" class="Fanhy_gradient-text" style="text-decoration:none;">FANHY · STUDIO</a>
    </div>
    <a href="index.html" class="Fanhy_btn">← 返回展厅</a>
  </header>

  <div class="Fanhy_page-head Fanhy_reveal">
    <span class="Fanhy_page-kicker">03 / GALLERY</span>
    <h1 class="Fanhy_page-title Fanhy_gradient-text">图文列表</h1>
    <p class="Fanhy_page-desc">数据来自数据库 <code style="color:var(--Fanhy-gold)">Fanhy_gallery</code> 表。原创矢量封面搭配摄影叙事，瀑布流呈现接口返回的真实数据。</p>
  </div>

  <div class="Fanhy_api-bar Fanhy_glass Fanhy_reveal">
    <span class="Fanhy_method">GET</span>
    <span>接口链接：</span>
    <a href="http://localhost:8618/api/gallery" target="_blank">http://localhost:8618/api/gallery</a>
    <span class="Fanhy_count-pill" id="Fanhy_totalPill">加载中…</span>
  </div>

  <div id="Fanhy_galleryGrid" class="Fanhy_gallery-grid">
    <div class="Fanhy_loading">✨ 正在加载画廊…</div>
  </div>

  <details class="Fanhy_glass Fanhy_reveal" style="margin-top:18px;">
    <summary style="padding:16px 22px;cursor:pointer;font-weight:700;color:var(--Fanhy-cyan);">📄 查看接口返回的原始数据（JSON）</summary>
    <pre class="Fanhy_raw" id="Fanhy_rawData">（加载后显示）</pre>
  </details>

  <footer class="Fanhy_footer">樊宏宇 · 24001010618 · Fanhy 全栈典藏展厅</footer>
</div>

<script src="js/Fanhy_particles.js"></script>
<script>
  /* 姓名：樊宏宇 | 学号：24001010618 | 时间：2026-11-19 | 大模型：Tencent Hunyuan Hy */
  (function () {
    var Fanhy_grid = document.getElementById('Fanhy_galleryGrid');
    var Fanhy_raw = document.getElementById('Fanhy_rawData');
    var Fanhy_pill = document.getElementById('Fanhy_totalPill');

    fetch('http://localhost:8618/api/gallery')
      .then(function (Fanhy_r) { return Fanhy_r.json(); })
      .then(function (Fanhy_res) {
        console.log('[Fanhy] /api/gallery 返回：', Fanhy_res);
        if (Fanhy_res.code !== 0) { throw new Error(Fanhy_res.msg); }
        var Fanhy_list = Fanhy_res.data.list;
        Fanhy_pill.textContent = '共 ' + Fanhy_res.data.total + ' 条';
        Fanhy_raw.textContent = JSON.stringify(Fanhy_res, null, 2);
        Fanhy_grid.innerHTML = '';
        Fanhy_list.forEach(function (Fanhy_item, Fanhy_i) {
          Fanhy_grid.innerHTML +=
            '<article class="Fanhy_gallery-item Fanhy_glass Fanhy_reveal" style="transition-delay:' + (Fanhy_i % 3 * 70) + 'ms">' +
              '<div class="Fanhy_gallery-pic">' +
                '<img src="' + Fanhy_item.Fanhy_imageUrl + '" alt="' + Fanhy_item.Fanhy_title + '" loading="lazy">' +
                '<span class="Fanhy_gallery-tag">' + Fanhy_item.Fanhy_category + '</span>' +
              '</div>' +
              '<div class="Fanhy_gallery-info">' +
                '<h3>' + Fanhy_item.Fanhy_title + '</h3>' +
                '<p>' + Fanhy_item.Fanhy_description + '</p>' +
                '<div class="Fanhy_gallery-foot">' +
                  '<span>' + Fanhy_item.Fanhy_author + ' · ' + Fanhy_item.Fanhy_createTime + '</span>' +
                  '<span class="Fanhy_likes">♥ ' + Fanhy_item.Fanhy_likes + '</span>' +
                '</div>' +
              '</div>' +
            '</article>';
        });
        Fanhy_observe();
      })
      .catch(function (Fanhy_err) {
        console.error('[Fanhy] /api/gallery 错误：', Fanhy_err);
        Fanhy_grid.innerHTML = '<div class="Fanhy_loading">❌ 数据加载失败：' + Fanhy_err.message + '</div>';
      });

    function Fanhy_observe() {
      var Fanhy_io = new IntersectionObserver(function (Fanhy_entries) {
        Fanhy_entries.forEach(function (Fanhy_e) {
          if (Fanhy_e.isIntersecting) { Fanhy_e.target.classList.add('Fanhy_visible'); Fanhy_io.unobserve(Fanhy_e.target); }
        });
      }, { threshold: 0.08 });
      document.querySelectorAll('.Fanhy_reveal:not(.Fanhy_visible)').forEach(function (Fanhy_el) { Fanhy_io.observe(Fanhy_el); });
    }
    Fanhy_observe();
  })();
</script>
</body>
</html>
