<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026-10-19 樊宏宇 媒体查询</title>
    <style>
        div,h2{
            margin: 0;
            padding: 0;
        }
        body,html,#box{
            height: 100%;
        }
        #box{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        h2{
            color: #fff;
        }
        /* 媒体查询，宽度小于等于1280px时背景蓝色 */
        @media screen and (max-width:1280px) {
            #box{
                background-color: blue;
            }
        }
    </style>
</head>
<body>
    <div id="box">
        <h2>樊宏宇 媒体查询</h2>
    </div>
</body>
</html>
