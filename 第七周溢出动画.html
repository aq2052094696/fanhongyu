<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>溢出动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            list-style: none;
            box-sizing: border-box;
        }
        body{
            padding:30px;
        }
        h2{
            text-align:center;
            margin-bottom:20px;
        }
        .list{
            width: 800px;
            margin:0 auto;
            display: flex;
            flex-wrap: wrap; /*自动换行，一行放3个，满了自动第二排*/
            gap:15px; /*卡片之间的间距*/
        }
        .list li{
            width: calc((100% - 30px) / 3); /*一行3个，减去gap间隙平分宽度*/
            height:240px;
            overflow:hidden; /*溢出隐藏，核心！*/
            position:relative;
            border:1px solid #ccc;
        }
        .list li img{
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
        }
        /* 文字样式 和课堂截图参数完全一致 */
        .txt{
            line-height: 22px;
            font-size: 12px;
            height: 44px;
            padding: 8px;
            background-color: rgba(0,0,0,0.6);
            color:#fff;
            position: absolute;
            left:0;
            bottom: -44px; /*默认藏在盒子外面底部*/
            transition:0.3s; /*平滑过渡动画*/
        }
        /* 悬停动画：文字向上滑入 */
        .list:first-of-type li:hover .txt{
            transform: translateY(-44px);
        }
        /* 老师第三种效果：奇数卡片hover文字全屏撑开 height:100% */
        .list:last-of-type li:nth-child(odd):hover .txt{
            height:100%;
        }
    </style>
</head>
<body>
    <h2>溢出动画</h2>
    <ul class="list">
        <li>
            <img src="img1/1.jpg" alt="">
            <div class="txt">图1 悬停文字向上滑出</div>
        </li>
        <li>
            <img src="img1/2.jpg" alt="">
            <div class="txt">图2 悬停文字向上滑出</div>
        </li>
        <li>
            <img src="img1/3.jpg" alt="">
            <div class="txt">图3 悬停文字向上滑出</div>
        </li>
        <li>
            <img src="img1/4.jpg" alt="">
            <div class="txt">图4 悬停文字向上滑出</div>
        </li>
        <li>
            <img src="img1/5.jpg" alt="">
            <div class="txt">图5 悬停文字向上滑出</div>
        </li>
        <li>
            <img src="img1/6.jpg" alt="">
            <div class="txt">图6 悬停文字向上滑出</div>
        </li>
    </ul>
</body>
</html>
