<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>618 樊宏宇的宅院出租 </title>
    <style>
        body {
            color: #333;

        }
        *{
            /* 盒模型属性 */
            margin: 0;
            padding: 0;
        }
        .container {
            /* 容器宽度 */
            width: 1200px;
            /* 外边距：上下 左右 */
            margin: 0 auto;
            background-color: #81ab0d;
            padding: 20px;
        }
        h2{
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }
        .card-wrap{
            background-color: pink;
        }
        #card-wrap{
            background-color: purple;
            height: 800px;
        }
        .card{
            width: 384px;
            background-color: #7ca5ab;
            /* 内边距：一个值：上下左右 */
            /* padding: 20px; */
            /* 内边距：俩个值：上下 左右 */
            /* padding: 20px 50px; */
            /* 内边距：三个值：上 左右 下 */
            /* padding: 20px 40px 60px; */
            /* 内边距：四个值：上 右 下 左 */
            padding: 20px 40px 60px 80px;
            /* 外边距：一个值：上下左右 */
            margin: 30px auto;

            /* 边框：宽度 样式:实线 虚线 点线 颜色 */
            border: 1px solid #000;
            /* margin: 20px; */
        }
        
        .card-img{
            width: 100%;
            height: 200px;
            background-color: #d67c7c;
            border: dotted 2px #000 ;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .card-title{
            font-size: 20px;
            margin: 10p 0;
        }
        .card-desc{
            font-size: 14px;
            color: #666;
            /* 字体加粗 */
            font-weight: bold;
        }
        .price{
            font-size: 16px;
            color: #f00;
        }

    </style>
</head>
<body>
    <div class="container">
        <h2>精选商品卡片</h2>
        <div id="card-wrap" class="card-wrap">
            <div class="card"> 
                <!-- 普通卡片 -->
                <div class="card-img"><img src="./img/3.jpg" alt="" width="100%" height="200px"></div>
                <h3 class="card-title">湖景别院</h3>
                <p class="card-desc">樊宏宇宅院,总统套房，位于城市中心</p>
                <div class="price">$100000/月</div>
            </div>
        </div>
    </div>
</body>
</html>
