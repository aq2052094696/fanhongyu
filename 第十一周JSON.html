<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-POP 女团档案 · JSON数据渲染</title>
    <style>
        :root {
            --pink: #ff4fa3;
            --pink-light: #ffd5eb;
            --purple: #8a2be2;
            --purple-deep: #4b0082;
            --bg-dark: #1a0a2e;
            --bg-card: rgba(255, 255, 255, 0.08);
            --border-glass: rgba(255, 255, 255, 0.18);
            --text: #fff;
            --text-dim: #d8c8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--text);
            background:
                radial-gradient(ellipse at 20% 10%, rgba(255,79,163,0.35) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 90%, rgba(138,43,226,0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(75,0,130,0.25) 0%, transparent 60%),
                linear-gradient(135deg, #0f0420 0%, #1a0a2e 50%, #2a0f3d 100%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* 背景漂浮光斑 */
        body::before, body::after {
            content: "";
            position: fixed;
            width: 500px; height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            z-index: -1;
            animation: float 12s ease-in-out infinite;
        }
        body::before { background: #ff4fa3; top: -100px; left: -100px; }
        body::after  { background: #8a2be2; bottom: -100px; right: -100px; animation-delay: -6s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(60px, -40px) scale(1.15); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ---- 标题 ---- */
        .header {
            text-align: center;
            margin-bottom: 36px;
        }
        .header h1 {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(90deg, #ff4fa3, #c77dff, #ff4fa3);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shine 4s linear infinite;
            letter-spacing: 4px;
            text-shadow: 0 0 40px rgba(255,79,163,0.3);
        }
        .header p {
            margin-top: 10px;
            color: var(--text-dim);
            font-size: 15px;
            letter-spacing: 2px;
        }
        @keyframes shine {
            0%   { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* ---- 统计卡片 ---- */
        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 22px 14px;
            text-align: center;
            transition: all 0.4s cubic-bezier(.2,.9,.3,1.3);
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,79,163,0.2), rgba(138,43,226,0.2));
            opacity: 0;
            transition: opacity 0.4s;
        }
        .stat-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(255,79,163,0.35);
        }
        .stat-card:hover::before { opacity: 1; }
        .stat-card > * { position: relative; z-index: 1; }
        .stat-card .num {
            font-size: 34px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff4fa3, #c77dff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .stat-card .label {
            font-size: 13px;
            color: var(--text-dim);
            margin-top: 6px;
            letter-spacing: 1px;
        }

        /* ---- 切换按钮 ---- */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .tabs button {
            padding: 12px 32px;
            border: 1px solid var(--border-glass);
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            color: var(--text-dim);
            cursor: pointer;
            border-radius: 30px;
            font-size: 15px;
            letter-spacing: 1px;
            transition: all 0.35s;
        }
        .tabs button:hover {
            color: #fff;
            border-color: var(--pink);
            box-shadow: 0 0 20px rgba(255,79,163,0.4);
        }
        .tabs button.active {
            color: #fff;
            background: linear-gradient(135deg, #ff4fa3, #8a2be2);
            border-color: transparent;
            box-shadow: 0 6px 25px rgba(255,79,163,0.5);
            font-weight: bold;
        }

        /* ---- 表格视图 ---- */
        .table-wrap {
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 10px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        thead th {
            padding: 16px 14px;
            text-align: left;
            background: linear-gradient(135deg, rgba(255,79,163,0.5), rgba(138,43,226,0.5));
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        thead th:first-child { border-radius: 14px 0 0 0; }
        thead th:last-child  { border-radius: 0 14px 0 0; }
        tbody td {
            padding: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            color: #eee;
            font-size: 14px;
        }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: rgba(255,79,163,0.1); }

        .team-ive   { color: #c77dff; font-weight: bold; }
        .team-black { color: #ff4fa3; font-weight: bold; }
        .score-bar {
            display: inline-block;
            width: 70px; height: 8px;
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
            overflow: hidden;
            vertical-align: middle;
            margin-right: 8px;
        }
        .score-bar i {
            display: block; height: 100%;
            background: linear-gradient(90deg, #ff4fa3, #c77dff);
            border-radius: 4px;
            transition: width 1s ease;
        }

        /* ---- 卡片视图 ---- */
        .card-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 22px;
        }
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 26px 22px;
            position: relative;
            overflow: hidden;
            transition: all 0.45s cubic-bezier(.2,.9,.3,1.3);
        }
        .card::before {
            content: "";
            position: absolute;
            top: -60px; right: -60px;
            width: 160px; height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,79,163,0.4), transparent 70%);
            transition: all 0.6s;
        }
        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 50px rgba(255,79,163,0.4);
            border-color: var(--pink);
        }
        .card:hover::before {
            top: -40px; right: -40px;
            background: radial-gradient(circle, rgba(255,79,163,0.6), transparent 70%);
        }
        .card .avatar {
            width: 72px; height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4fa3, #8a2be2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(255,79,163,0.5);
            position: relative;
            z-index: 1;
        }
        .card h3 {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 1px;
            position: relative; z-index: 1;
        }
        .card .en-name {
            font-size: 13px;
            color: var(--text-dim);
            font-style: italic;
            margin-top: 2px;
            position: relative; z-index: 1;
        }
        .card .team-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            position: relative; z-index: 1;
        }
        .badge-ive   { background: linear-gradient(135deg, #d8b4fe, #a855f7); color: #fff; }
        .badge-black { background: linear-gradient(135deg, #ff4fa3, #c2185b); color: #fff; }

        .card-info {
            margin-top: 16px;
            position: relative; z-index: 1;
        }
        .card-info p {
            font-size: 13px;
            color: #d8c8f0;
            line-height: 2;
        }
        .card-info p span {
            color: #fff;
            font-weight: bold;
        }

        .popularity {
            margin-top: 14px;
            position: relative; z-index: 1;
        }
        .popularity .label {
            font-size: 12px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .popularity .bar {
            height: 8px;
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
            overflow: hidden;
        }
        .popularity .bar i {
            display: block; height: 100%;
            background: linear-gradient(90deg, #ff4fa3, #c77dff);
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(255,79,163,0.8);
        }

        /* ---- 原始JSON ---- */
        .raw-json {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 28px;
            font-family: "Fira Code", Consolas, monospace;
            font-size: 13px;
            line-height: 1.7;
            color: #f8f8f2;
            overflow-x: auto;
            white-space: pre;
            box-shadow: inset 0 0 40px rgba(255,79,163,0.15);
        }

        .hidden { display: none !important; }

        /* ---- 响应式 ---- */
        @media (max-width: 768px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .header h1 { font-size: 28px; letter-spacing: 2px; }
            .tabs button { padding: 10px 18px; font-size: 13px; }
            .card-view { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ K-POP 女团档案 ✨</h1>
            <p>IVE · 6人 ｜ BLACKPINK · 4人 · JSON数据渲染</p>
        </div>

        <!-- 统计条 -->
        <div class="stats" id="stats"></div>

        <!-- 切换按钮 -->
        <div class="tabs">
            <button class="active" data-view="table">📋 表格视图</button>
            <button data-view="card">💎 卡片视图</button>
            <button data-view="raw">⚙️ 原始JSON</button>
        </div>

        <!-- 表格视图 -->
        <div id="view-table" class="table-wrap">
            <table id="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>姓名</th>
                        <th>英文名</th>
                        <th>团体</th>
                        <th>职位</th>
                        <th>年龄</th>
                        <th>人气指数</th>
                        <th>代表作品</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- 卡片视图 -->
        <div id="view-card" class="hidden card-view"></div>

        <!-- 原始JSON视图 -->
        <div id="view-raw" class="hidden raw-json"></div>
    </div>

    <!-- 内嵌JSON数据：IVE 6人 + BLACKPINK 4人 -->
    <script id="member-json" type="application/json">
    [
        { "id": 1, "name": "安宥真", "enName": "An Yu-jin",   "team": "IVE", "position": "队长 / 主唱",     "age": 21, "score": 95, "hobby": ["跳舞", "吃播", "拍照"],    "debut": "2021.12.01", "hit": "Eleven, Love Dive, After Like" },
        { "id": 2, "name": "张员瑛", "enName": "Jang Won-young", "team": "IVE", "position": "门面 / 副唱",    "age": 20, "score": 97, "hobby": ["拍照", "购物", "看电影"],  "debut": "2021.12.01", "hit": "Eleven, Love Dive, I Am" },
        { "id": 3, "name": "金秋天", "enName": "Kim Gaeul",    "team": "IVE", "position": "主舞 / 说唱",     "age": 22, "score": 88, "hobby": ["滑板", "听音乐", "编舞"],  "debut": "2021.12.01", "hit": "Eleven, After Like" },
        { "id": 4, "name": "金智媛", "enName": "Kim Ji-won",   "team": "IVE", "position": "主唱",            "age": 21, "score": 86, "hobby": ["唱歌", "钢琴", "烘焙"],    "debut": "2021.12.01", "hit": "Eleven, I've Mine" },
        { "id": 5, "name": "Liz",    "enName": "Liz",          "team": "IVE", "position": "副主唱",          "age": 20, "score": 85, "hobby": ["画画", "吃甜食", "发呆"],  "debut": "2021.12.01", "hit": "Love Dive, After Like" },
        { "id": 6, "name": "李瑞",   "enName": "Lee Seo",      "team": "IVE", "position": "忙内 / 副唱",     "age": 18, "score": 90, "hobby": ["跳舞", "玩游戏", "时尚"],  "debut": "2021.12.01", "hit": "I Am, I've Mine" },

        { "id": 7, "name": "Jisoo",  "enName": "Kim Ji-soo",   "team": "BLACKPINK", "position": "门面 / 主唱",  "age": 30, "score": 96, "hobby": ["演戏", "滑雪", "画画"],    "debut": "2016.08.08", "hit": "Flower, Whistle, Ddu-Du Ddu-Du" },
        { "id": 8, "name": "Jennie", "enName": "Kim Jennie",   "team": "BLACKPINK", "position": "主说唱 / 主唱", "age": 29, "score": 99, "hobby": ["时尚", "摄影", "听音乐"],  "debut": "2016.08.08", "hit": "Solo, Ddu-Du Ddu-Du, Pink Venom" },
        { "id": 9, "name": "Rosé",   "enName": "Park Chae-young", "team": "BLACKPINK", "position": "主唱 / 吉他", "age": 28, "score": 94, "hobby": ["弹吉他", "画画", "旅行"], "debut": "2016.08.08", "hit": "On The Ground, Gone" },
        { "id": 10,"name": "Lisa",   "enName": "Lalisa Manoban", "team": "BLACKPINK", "position": "主舞 / 说唱", "age": 27, "score": 98, "hobby": ["跳舞", "摄影", "吃美食"],  "debut": "2016.08.08", "hit": "Lalisa, Money, Ddu-Du Ddu-Du" }
    ]
    </script>

    <script>
        const members = JSON.parse(document.getElementById('member-json').textContent);

        // 统计条
        function renderStats(data) {
            const ive    = data.filter(m => m.team === 'IVE').length;
            const black  = data.filter(m => m.team === 'BLACKPINK').length;
            const avg    = (data.reduce((s, m) => s + m.score, 0) / data.length).toFixed(1);
            const top    = [...data].sort((a, b) => b.score - a.score)[0];

            document.getElementById('stats').innerHTML = `
                <div class="stat-card"><div class="num">${data.length}</div><div class="label">总成员</div></div>
                <div class="stat-card"><div class="num">${ive}</div><div class="label">IVE 成员</div></div>
                <div class="stat-card"><div class="num">${black}</div><div class="label">BLACKPINK</div></div>
                <div class="stat-card"><div class="num">${avg}</div><div class="label">平均人气</div></div>
                <div class="stat-card"><div class="num">${top.name}</div><div class="label">人气第一 · ${top.score}分</div></div>
            `;
        }

        // 表格
        function renderTable(data) {
            const tbody = document.querySelector('#data-table tbody');
            tbody.innerHTML = data.map(m => `
                <tr>
                    <td>#${m.id}</td>
                    <td><strong>${m.name}</strong></td>
                    <td style="color:#d8c8f0;font-style:italic;">${m.enName}</td>
                    <td class="${m.team === 'IVE' ? 'team-ive' : 'team-black'}">${m.team}</td>
                    <td>${m.position}</td>
                    <td>${m.age}岁</td>
                    <td><span class="score-bar"><i style="width:${m.score}%"></i></span>${m.score}</td>
                    <td style="color:#d8c8f0;">${m.hit}</td>
                </tr>
            `).join('');
        }

        // 卡片
        function renderCards(data) {
            document.getElementById('view-card').innerHTML = data.map(m => `
                <div class="card">
                    <div class="avatar">${m.name[0]}</div>
                    <h3>${m.name}</h3>
                    <div class="en-name">${m.enName}</div>
                    <span class="team-badge ${m.team === 'IVE' ? 'badge-ive' : 'badge-black'}">${m.team}</span>
                    <div class="card-info">
                        <p><span>🎤 职位：</span>${m.position}</p>
                        <p><span>🎂 年龄：</span>${m.age}岁</p>
                        <p><span>📅 出道：</span>${m.debut}</p>
                        <p><span>💖 爱好：</span>${m.hobby.join(' / ')}</p>
                    </div>
                    <div class="popularity">
                        <div class="label">
                            <span>🔥 人气指数</span>
                            <span>${m.score}</span>
                        </div>
                        <div class="bar"><i style="width:${m.score}%"></i></div>
                    </div>
                </div>
            `).join('');
        }

        // 原始JSON
        function renderRaw(data) {
            document.getElementById('view-raw').textContent = JSON.stringify(data, null, 4);
        }

        // 切换
        function switchView(view) {
            document.querySelectorAll('.tabs button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === view);
            });
            ['table', 'card', 'raw'].forEach(v => {
                document.getElementById('view-' + v).classList.toggle('hidden', v !== view);
            });
        }
        document.querySelectorAll('.tabs button').forEach(btn => {
            btn.addEventListener('click', () => switchView(btn.dataset.view));
        });

        // 初始化
        renderStats(members);
        renderTable(members);
        renderCards(members);
        renderRaw(members);
    </script>
</body>
</html>
