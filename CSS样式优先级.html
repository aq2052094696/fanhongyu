<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS层叠与继承</title>
    <!-- 内部样式 -->
    <link rel="stylesheet" href="outer.css">
    <style>
        /* 继承 */
        /* 越具体越优先：内嵌样式 > 后代选择器 > id 选择器 > class 选择器 > 元素选择器 */
        #box{
            background-color: rgb(228, 226, 236);
        }
        /* 后代选择器 */
        #box #h2{
            color: rgb(0, 0, 0);
        }
        /* 优先级：id 选择器 > class 选择器 > 元素选择器 */
           .h2{
            color: rgb(238, 238, 238);
        }
        h2{
            color: rgb(238, 238, 238);
        } */
        #h2{
            color:rgb(178, 225, 23);
        }
        h2{
            color:aqua;
        }
        .h2{
            color:blue;
        }
    </style>
</head>
<body>
    <!-- 越具体越优先 -->
    <div id="box">
        <h2>层叠与继承</h2>
        <!-- <h2 id="h2" class="h2" style="color: rgb(199, 121, 182);">这是什么颜色？</h2> -->
        <h2 id="h2" class="h2">这是什么颜色？</h2>
    </div>
</body>
</html>
